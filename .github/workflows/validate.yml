name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Exercise repository audit
        run: python scripts/audit_project.py --root . --format json
